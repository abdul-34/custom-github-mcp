# DigitalOcean App Platform spec.
# Create with: doctl apps create --spec .do/app.yaml
name: github-mcp
region: nyc
services:
  - name: web
    github:
      repo: YOUR_GITHUB_USERNAME/github-mcp
      branch: main
      deploy_on_push: true

    environment_slug: node-js
    # --include=dev is required: NODE_ENV=production below makes npm skip
    # devDependencies, where typescript and @types/node live.
    build_command: npm ci --include=dev && npm run build
    run_command: npm start

    # Smallest shared-CPU instance. The server idles near 105 MB.
    instance_size_slug: apps-s-1vcpu-0.5gb
    # Sessions are in memory — keep this at 1.
    instance_count: 1

    http_port: 8080
    health_check:
      http_path: /health

    envs:
      - key: NODE_ENV
        value: production

      # GitHub PAT the tools act with. Scope it as tightly as you can.
      - key: GITHUB_TOKEN
        type: SECRET
        value: CHANGE_ME

      # Shared secret clients must present. openssl rand -hex 32
      - key: MCP_AUTH_TOKEN
        type: SECRET
        value: CHANGE_ME

      # App Platform terminates TLS at its own proxy and overwrites
      # X-Forwarded-For, so exactly one hop is trustworthy here.
      - key: TRUST_PROXY
        value: "1"

      - key: MCP_READ_ONLY
        value: "false"
      - key: ALLOWED_REPOS
        value: ""
      - key: MCP_ALLOW_QUERY_TOKEN
        value: "false"
      - key: ALLOWED_ORIGINS
        value: ""
      - key: RATE_LIMIT_PER_MINUTE
        value: "240"
